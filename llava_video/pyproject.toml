[project]
name = "countvideobench-llava-video"
version = "1.0.0"
description = "Evaluation of LLaVA-Video (Qwen2 7B / 72B) on CountVideoBench"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "transformers==4.55.4",
    "accelerate==1.12.0",
    "llava==1.7.0.dev0",          # LLaVA-NeXT git commit, see [tool.uv.sources]
    "flash-attn==2.8.3",          # prebuilt wheels, see [tool.uv.sources]
    "decord2==3.0.0",             # provides the `decord` module (wheels for x86_64 and aarch64)
    "einops==0.8.1",              # imported by LLaVA-NeXT
    "huggingface-hub==0.36.0",
    "numpy==2.4.0",
    "tqdm==4.67.1",
]

[tool.uv]
# Scripts only: nothing to build or install from this folder.
package = false
# Linux only, on x86_64 or aarch64 (e.g. GH200). The lock fails if a
# dependency has no wheel for one of these platforms.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Transitive dependencies pinned to the versions of the environment used for
# the paper (pip freeze). They only apply when a package is actually required.
constraint-dependencies = [
    "certifi==2025.11.12",
    "charset-normalizer==3.4.4",
    "filelock==3.20.1",
    "fsspec==2025.12.0",
    "hf-xet==1.2.0",
    "idna==3.11",
    "jinja2==3.1.6",
    "markupsafe==2.1.5",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "nvidia-cublas==13.0.0.19",
    "nvidia-cuda-cupti==13.0.48",
    "nvidia-cuda-nvrtc==13.0.48",
    "nvidia-cuda-runtime==13.0.48",
    "nvidia-cudnn-cu13==9.13.0.50",
    "nvidia-cufft==12.0.0.15",
    "nvidia-cufile==1.15.0.42",
    "nvidia-curand==10.4.0.35",
    "nvidia-cusolver==12.0.3.29",
    "nvidia-cusparse==12.6.2.49",
    "nvidia-cusparselt-cu13==0.8.0",
    "nvidia-nccl-cu13==2.27.7",
    "nvidia-nvjitlink==13.0.39",
    "nvidia-nvshmem-cu13==3.3.24",
    "nvidia-nvtx==13.0.39",
    "packaging==25.0",
    "pillow==12.0.0",
    "psutil==7.2.1",
    "pyyaml==6.0.3",
    "regex==2025.11.3",
    "requests==2.32.5",
    "safetensors==0.7.0",
    "setuptools==70.2.0",
    "sympy==1.14.0",
    "tokenizers==0.21.4",
    "triton==3.5.1",
    "typing-extensions==4.15.0",
    "urllib3==2.6.2",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# LLaVA-NeXT (Apache-2.0), commit used for the paper. It declares no runtime
# dependencies of its own.
llava = { git = "https://github.com/LLaVA-VL/LLaVA-NeXT.git", rev = "e9835311c6f515a13702eb7a7750fcd936f65ed8" }
# Prebuilt flash-attn wheels (Python 3.12, CUDA 13.0, torch 2.9) from
# https://github.com/mjun0812/flash-attention-prebuild-wheels (BSD-3-Clause).
# uv installs the one matching the machine's architecture. The aarch64 wheel is
# the one used for the paper.
flash-attn = [
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.6.4/flash_attn-2.8.3+cu130torch2.9-cp312-cp312-linux_aarch64.whl", marker = "platform_machine == 'aarch64'" },
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu130torch2.9-cp312-cp312-linux_x86_64.whl", marker = "platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
