[project]
name = "countvideobench-videollama2"
version = "1.0.0"
description = "Evaluation of VideoLLaMA 2 (7B / 72B) on CountVideoBench"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==5.2.0",
    "accelerate==1.12.0",
    "flash-attn==2.8.3",          # prebuilt wheels, see [tool.uv.sources]
    "timm==1.0.24",
    "einops==0.8.2",
    "decord2==3.0.0",             # provides the `decord` module, with aarch64 wheels
    "opencv-python-headless==4.13.0.92",
    "imageio==2.37.2",
    "numpy==2.4.2",
    "pillow==12.0.0",
    "requests==2.32.5",
    "huggingface-hub==1.4.1",
    "tqdm==4.67.3",
]

[tool.uv]
# Scripts only: nothing to build or install from this folder.
package = false
# Linux only, on x86_64 or aarch64 (e.g. GH200). The lock fails if a
# dependency has no wheel for one of these platforms.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Transitive dependencies pinned to the versions of the environment used for
# the paper (pip freeze). They only apply when a package is actually required.
constraint-dependencies = [
    "annotated-doc==0.0.4",
    "anyio==4.12.1",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "click==8.3.1",
    "cuda-bindings==12.9.4",
    "cuda-pathfinder==1.3.4",
    "filelock==3.24.3",
    "fsspec==2026.2.0",
    "h11==0.16.0",
    "hf-xet==1.2.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "jinja2==3.1.6",
    "markdown-it-py==4.0.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-cupti-cu12==12.8.90",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-cufft-cu12==11.3.3.83",
    "nvidia-cufile-cu12==1.13.1.3",
    "nvidia-curand-cu12==10.3.9.90",
    "nvidia-cusolver-cu12==11.7.3.90",
    "nvidia-cusparse-cu12==12.5.8.93",
    "nvidia-cusparselt-cu12==0.7.1",
    "nvidia-nccl-cu12==2.27.5",
    "nvidia-nvjitlink-cu12==12.8.93",
    "nvidia-nvshmem-cu12==3.4.5",
    "nvidia-nvtx-cu12==12.8.90",
    "packaging==26.0",
    "psutil==7.2.2",
    "pygments==2.19.2",
    "pyyaml==6.0.3",
    "regex==2026.1.15",
    "rich==14.3.2",
    "safetensors==0.7.0",
    "setuptools==82.0.0",
    "shellingham==1.5.4",
    "sympy==1.14.0",
    "tokenizers==0.22.2",
    "triton==3.6.0",
    "typer==0.24.0",
    "typer-slim==0.24.0",
    "typing-extensions==4.15.0",
    "urllib3==2.6.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
# Prebuilt flash-attn wheels (Python 3.12, CUDA 12.8, torch 2.10) from
# https://github.com/mjun0812/flash-attention-prebuild-wheels (BSD-3-Clause).
# uv installs the one matching the machine's architecture. The aarch64 wheel is
# the one used for the paper (sha256 4c2a5af0...).
flash-attn = [
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu128torch2.10-cp312-cp312-linux_aarch64.whl", marker = "platform_machine == 'aarch64'" },
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu128torch2.10-cp312-cp312-linux_x86_64.whl", marker = "platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
