[project]
name = "countvideobench-gemini-3-1-pro"
version = "1.0.0"
description = "Evaluation of Gemini 3.1 Pro (Gemini Batch API) on CountVideoBench"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "google-genai==1.70.0",
    "opencv-python-headless==4.13.0.92",
    "tqdm==4.67.3",
    "huggingface-hub==1.9.2",
]

[tool.uv]
# Scripts only: nothing to build or install from this folder.
package = false
# Linux only, on x86_64 or aarch64 (e.g. GH200). The lock fails if a
# dependency has no wheel for one of these platforms.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Transitive dependencies pinned to the versions of the environment used for
# the paper (pip freeze). They only apply when a package is actually required.
constraint-dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.13.0",
    "certifi==2026.2.25",
    "cffi==2.0.0",
    "charset-normalizer==3.4.7",
    "cryptography==46.0.6",
    "distro==1.9.0",
    "google-auth==2.49.1",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "numpy==2.4.4",
    "pyasn1==0.6.3",
    "pyasn1-modules==0.4.2",
    "pycparser==3.0",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "requests==2.33.1",
    "sniffio==1.3.1",
    "tenacity==9.1.4",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.6.3",
    "websockets==16.0",
    # Not in the environment of the paper (huggingface-hub was added): typer
    # current when huggingface-hub 1.9.2 was released. From 0.26 on, typer no
    # longer installs click, which the `hf` command needs.
    "typer==0.24.1",
]
