[project]
name = "countvideobench-nvila"
version = "1.0.0"
description = "Evaluation of NVILA (8B / 15B) on CountVideoBench"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==4.46.0",
    "accelerate==1.12.0",
    "vila==2.0.0",                # NVlabs/VILA (Python package `llava`), git commit, see [tool.uv.sources]
    "flash-attn==2.8.3",          # prebuilt wheels, see [tool.uv.sources]
    # Imported by VILA when loading NVILA (VILA's own dependency list is ignored,
    # see `dependency-metadata` below).
    "datasets==4.5.0",
    "deepspeed==0.18.6",
    "einops==0.8.2",
    "hydra-core==1.3.2",
    "loguru==0.7.3",
    "matplotlib==3.10.8",
    "opencv-python-headless==4.13.0.92",
    "packaging==26.0",
    "pillow==12.0.0",
    "ps3-torch==0.1.3",
    "pydantic==2.12.5",
    "requests==2.32.5",
    "s2wrapper==0.1",             # git commit, see [tool.uv.sources]
    "timm==1.0.24",
    "triton==3.6.0",
    # Used by evaluate.py.
    "huggingface-hub==0.36.2",
    "numpy==2.4.2",
    "tqdm==4.67.3",
]

[tool.uv]
# Scripts only: nothing to build or install from this folder.
package = false
# Linux only, on x86_64 or aarch64 (e.g. GH200). The lock fails if a
# dependency has no wheel for one of these platforms.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# VILA's pyproject pins versions that conflict with the environment used for the
# paper (torch 2.3.0, numpy 1.26.4, pydantic<2, gradio...). As for the paper
# (`pip install -e . --no-deps`), VILA is installed without its declared
# dependencies; the packages it needs are listed above.
dependency-metadata = [
    { name = "vila", version = "2.0.0", requires-dist = [] },
]
# datasets 4.5.0 declares fsspec<=2025.10.0, but the environment used for the
# paper had fsspec 2026.2.0.
override-dependencies = [
    "fsspec[http]==2026.2.0",
]
# Transitive dependencies pinned to the versions of the environment used for
# the paper (pip freeze). They only apply when a package is actually required.
constraint-dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.3",
    "aiosignal==1.4.0",
    "annotated-types==0.7.0",
    "antlr4-python3-runtime==4.9.3",
    "anyio==4.12.1",
    "attrs==25.4.0",
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "contourpy==1.3.3",
    "cuda-bindings==12.9.4",
    "cuda-pathfinder==1.3.4",
    "cycler==0.12.1",
    "dill==0.4.0",
    "filelock==3.24.2",
    "fonttools==4.61.1",
    "frozenlist==1.8.0",
    "ftfy==6.3.1",
    "h11==0.16.0",
    "hf-xet==1.2.0",
    "hjson==3.1.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "jinja2==3.1.6",
    "kiwisolver==1.4.9",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "msgpack==1.1.2",
    "multidict==6.7.1",
    "multiprocess==0.70.18",
    "networkx==3.6.1",
    "ninja==1.13.0",
    "nvidia-cublas-cu12==12.8.4.1",
    "nvidia-cuda-cupti-cu12==12.8.90",
    "nvidia-cuda-nvrtc-cu12==12.8.93",
    "nvidia-cuda-runtime-cu12==12.8.90",
    "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-cufft-cu12==11.3.3.83",
    "nvidia-cufile-cu12==1.13.1.3",
    "nvidia-curand-cu12==10.3.9.90",
    "nvidia-cusolver-cu12==11.7.3.90",
    "nvidia-cusparse-cu12==12.5.8.93",
    "nvidia-cusparselt-cu12==0.7.1",
    "nvidia-nccl-cu12==2.27.5",
    "nvidia-nvjitlink-cu12==12.8.93",
    "nvidia-nvshmem-cu12==3.4.5",
    "nvidia-nvtx-cu12==12.8.90",
    "omegaconf==2.3.0",
    "pandas==3.0.0",
    "propcache==0.4.1",
    "protobuf==6.33.5",
    "psutil==7.2.2",
    "py-cpuinfo==9.0.0",
    "pyarrow==23.0.1",
    "pydantic-core==2.41.5",
    "pyparsing==3.3.2",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "regex==2026.1.15",
    "safetensors==0.7.0",
    "sentencepiece==0.2.1",
    "setuptools==82.0.0",
    "six==1.17.0",
    "sympy==1.14.0",
    "tiktoken==0.12.0",
    "tokenizers==0.20.3",
    "typing-extensions==4.15.0",
    "typing-inspection==0.4.2",
    "urllib3==2.6.3",
    "wcwidth==0.6.0",
    "xxhash==3.6.0",
    "yarl==1.22.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
vila = { git = "https://github.com/NVlabs/VILA", rev = "b760c34b9487fd736b4075f5111fbef3d80a37e9" }
s2wrapper = { git = "https://github.com/bfshi/scaling_on_scales", rev = "9c008a37540e761f53574b488979db6e49a64312" }
# Prebuilt flash-attn wheels (Python 3.12, CUDA 12.8, torch 2.10) from
# https://github.com/mjun0812/flash-attention-prebuild-wheels (BSD-3-Clause).
# uv installs the one matching the machine's architecture. The aarch64 wheel is
# the one used for the paper (sha256 4c2a5af0...).
flash-attn = [
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu128torch2.10-cp312-cp312-linux_aarch64.whl", marker = "platform_machine == 'aarch64'" },
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu128torch2.10-cp312-cp312-linux_x86_64.whl", marker = "platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
