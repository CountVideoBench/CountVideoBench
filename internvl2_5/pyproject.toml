[project]
name = "countvideobench-internvl2-5"
version = "1.0.0"
description = "Evaluation of InternVL2.5 (8B / 78B) on CountVideoBench"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==4.37.2",
    "accelerate==1.12.0",
    "bitsandbytes==0.49.2",       # 8-bit weights (load_in_8bit)
    "flash-attn==2.8.3",          # prebuilt wheels, see [tool.uv.sources]
    "decord2==3.0.0",             # provides the `decord` module, with x86_64 and aarch64 wheels
    "timm==1.0.24",               # required by the InternVL remote code
    "einops==0.8.2",              # required by the InternVL remote code
    "sentencepiece==0.2.1",       # slow tokenizer of the 8B model
    "huggingface-hub==0.36.2",
    "numpy==2.4.2",
    "pillow==12.0.0",
    "tqdm==4.67.3",
]

[tool.uv]
# Scripts only: nothing to build or install from this folder.
package = false
# Linux only, on x86_64 or aarch64 (e.g. GH200). The lock fails if a
# dependency has no wheel for one of these platforms.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
# Transitive dependencies pinned to the versions of the environment used for
# the paper. They only apply when a package is actually required.
constraint-dependencies = [
    "certifi==2026.1.4",
    "charset-normalizer==3.4.4",
    "cuda-bindings==13.0.3",
    "cuda-pathfinder==1.2.2",
    "filelock==3.24.2",
    "fsspec==2026.2.0",
    "hf-xet==1.2.0",
    "idna==3.11",
    "jinja2==3.1.6",
    "markupsafe==2.1.5",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "nvidia-cublas==13.1.0.3",
    "nvidia-cuda-cupti==13.0.85",
    "nvidia-cuda-nvrtc==13.0.88",
    "nvidia-cuda-runtime==13.0.96",
    "nvidia-cudnn-cu13==9.15.1.9",
    "nvidia-cufft==12.0.0.61",
    "nvidia-cufile==1.15.1.6",
    "nvidia-curand==10.4.0.35",
    "nvidia-cusolver==12.0.4.66",
    "nvidia-cusparse==12.6.3.3",
    "nvidia-cusparselt-cu13==0.8.0",
    "nvidia-nccl-cu13==2.28.9",
    "nvidia-nvjitlink==13.0.88",
    "nvidia-nvshmem-cu13==3.4.5",
    "nvidia-nvtx==13.0.85",
    "packaging==26.0",
    "psutil==7.2.2",
    "pyyaml==6.0.3",
    "regex==2026.1.15",
    "requests==2.32.5",
    "safetensors==0.7.0",
    "setuptools==70.2.0",
    "sympy==1.14.0",
    "tokenizers==0.15.2",
    "triton==3.6.0",
    "typing-extensions==4.15.0",
    "urllib3==2.6.3",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# Prebuilt flash-attn wheels (Python 3.12, CUDA 13.0, torch 2.10) from
# https://github.com/mjun0812/flash-attention-prebuild-wheels (BSD-3-Clause).
# uv installs the one matching the machine's architecture. The aarch64 wheel is
# the one used for the paper.
flash-attn = [
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu130torch2.10-cp312-cp312-linux_aarch64.whl", marker = "platform_machine == 'aarch64'" },
    { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.7.16/flash_attn-2.8.3+cu130torch2.10-cp312-cp312-linux_x86_64.whl", marker = "platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
